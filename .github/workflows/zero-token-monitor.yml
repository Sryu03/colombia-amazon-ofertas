name: Zero-Token Amazon Colombia Monitor (24/7 Cloud)

on:
  schedule:
    # Se ejecuta automáticamente en la nube cada 10 minutos (sin depender de tu PC)
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-and-broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml beautifulsoup4

      - name: Run Zero-Token Monitor, Colombia Evaluator & Telegram Broadcaster
        env:
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG || 'pillepues-20' }}
          PUBLIC_WEB_URL: ${{ secrets.PUBLIC_WEB_URL || 'https://vitrina-colombia-ofertas.vercel.app' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@pillepues' }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          LIVE_SCRAPE: "true"
          DISCOVERY_ENABLED: "true"
          MAX_LIVE_ASINS: "60"
        run: |
          PYTHONPATH=. python -m src.monitor.run_cloud_cycle

      - name: Commit and push updated deals catalog & price history to trigger Vercel CDN
        run: |
          cp -r public/* docs/ 2>/dev/null || true
          git config user.name "PillePues Cloud Bot"
          git config user.email "bot@pillepues.local"
          git add public/data/deals.json public/data/outbox_cards.json public/data/price_history.json data/watchlist.json docs/data/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(cloud-bot): update Amazon Colombia deals & price history [skip ci]"
            git push
          else
            echo "No price changes detected — 0 tokens spent."
          fi
