name: Zero-Token Amazon Colombia Monitor (24/7 Cloud)

on:
  schedule:
    # Se ejecuta automáticamente en minutos desfasados fuera de hora pico (cada 15 min) para evitar retrasos de GitHub
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      publish_catalog:
        description: "Publicar ofertas verificadas del catálogo en Telegram si el scraping en vivo no detecta bajadas nuevas"
        required: false
        default: false
        type: boolean
      max_telegram:
        description: "Máximo de mensajes a enviar a Telegram por ejecución"
        required: false
        default: "5"
        type: string

permissions:
  contents: write

concurrency:
  group: zero-token-monitor-main
  cancel-in-progress: false

jobs:
  monitor-and-broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml beautifulsoup4 curl_cffi Pillow

      - name: Run Zero-Token Monitor, Colombia Evaluator & Telegram Broadcaster
        env:
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG || 'pillepues-20' }}
          PUBLIC_WEB_URL: ${{ secrets.PUBLIC_WEB_URL || 'https://colombia-amazon-ofertas.vercel.app' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@pillepues' }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          LIVE_SCRAPE: "true"
          DISCOVERY_ENABLED: "true"
          MAX_LIVE_ASINS: "60"
          PUBLISH_VERIFIED_CATALOG: ${{ inputs.publish_catalog || 'false' }}
          MAX_TELEGRAM_PER_CYCLE: ${{ inputs.max_telegram || '5' }}
        run: |
          PYTHONPATH=. python -m src.monitor.run_cloud_cycle

      - name: Commit and push updated deals catalog & price history to trigger Vercel CDN
        run: |
          cp -r public/* docs/ 2>/dev/null || true
          git config user.name "PillePues Cloud Bot"
          git config user.email "bot@pillepues.local"
          git add public/data/deals.json public/data/outbox_cards.json public/data/price_history.json data/watchlist.json docs/data/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(cloud-bot): update Amazon Colombia deals & price history [skip ci]"
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort 2>/dev/null || true
              git fetch origin main
              git reset --soft origin/main
              git add public/data/deals.json public/data/outbox_cards.json public/data/price_history.json data/watchlist.json docs/data/ 2>/dev/null || true
              git commit -m "chore(cloud-bot): update Amazon Colombia deals & price history [skip ci]"
            fi
            git push
          else
            echo "No price changes detected — 0 tokens spent."
          fi
