[project]
name = "amazon-colombia-affiliates"
version = "1.0.0"
description = "Sistema Agentico Zero-Token de Afiliados Amazon.com para Colombia (Telegram + Microsoft Teams + Web en Vercel)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
scraping = [
    "scrapling>=0.4.0",
    "keepa>=1.3.0",
    "python-amazon-paapi>=5.0.0",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]
